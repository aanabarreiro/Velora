<div class="page">

  <header class="topbar">
    <img class="logo" src="../../../assets/img/branco_alto_contraste2.png" alt="logo">
    <div class="user">
      Márcia
      <span class="avatar"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 34 34"><g fill="none" stroke="currentColor" stroke-width="2"><path stroke-linejoin="round" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="12" cy="7" r="3"/></g></svg></span>
    </div>
  </header>

  <div class="content">

    <aside class="sidebar">
      <h3 class="side-title">
        📋 Pendências
      </h3>

      <ul class="pending-list">
        <li *ngFor="let os of pendencias">
          {{ os }}
        </li>
      </ul>
    </aside>

    <main class="main">

      <div class="top-section">
        <h2>Máquinas em funcionamento</h2>
        <button class="btn-tab">Pré recurtimento</button>
      </div>

      <div class="machines">

        <!-- CARD – Máquina -->
        <div class="machine-card" *ngFor="let m of maquinas">

          <h3 class="machine-name">{{ m.nome }}</h3>

          <div class="machine-user">
            👤 {{ m.usuario }}
          </div>

          <div class="machine-os">
            {{ m.os }}
          </div>

          <p class="time">
            {{ m.tempo }}
          </p>
              <div class="status"
               [ngClass]="{
                 'status-red': m.status.tipo === 'vermelho',
                 'status-yellow': m.status.tipo === 'amarelo',
                 'status-blue': m.status.tipo === 'azul'
               }">
            {{ m.status.texto }}
          </div>

        </div>

      </div>

    </main>

  </div>

</div>
