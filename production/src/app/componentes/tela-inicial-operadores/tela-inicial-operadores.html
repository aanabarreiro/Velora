<!-- velora.component.html -->
<div class="app-wrap">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="/mnt/data/Captura de Tela (119).png" alt="logo">
    </div>
    <div class="topbar-right">
      <div class="user">Carlos <span class="avatar">◯</span></div>
    </div>
  </header>

  <main class="viewport">
    <section class="card">
      <h2 class="title">Ordem atual</h2>

      <div class="order-id">
        <span class="order-label">OS-</span>
        <span class="order-number">12345</span>
      </div>

      <div class="details-grid">
        <div class="col">
          <p class="detail-title">Artigo:</p>
          <p class="detail-value">3404 - NAPA OUTDOOR</p>

          <p class="detail-title">Espessura Final:</p>
          <p class="detail-value">09/11</p>
        </div>

        <div class="col center">
          <p class="detail-title">Cliente:</p>
          <p class="detail-value big">202 - DASS NORDESTE - ITAPIPOCA</p>

          <p class="detail-title">Ordem de compra:</p>
          <p class="detail-value">14749476</p>
        </div>

        <div class="col right">
          <p class="detail-title">Cor:</p>
          <p class="detail-value">STONE KHAKI</p>

          <p class="detail-title">Tipo Acabado:</p>
          <p class="detail-value">SEM ESTAMPA</p>

          <p class="detail-title">Toque:</p>
          <p class="detail-value">MACIO</p>
        </div>
      </div>

      <div class="actions-row">
        <button class="action btn-start">
          <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M9 16q.425 0 .713-.288T10 15V9q0-.425-.288-.712T9 8t-.712.288T8 9v6q0 .425.288.713T9 16m4.175-.775l3.9-2.6q.35-.225.35-.625t-.35-.625l-3.9-2.6q-.375-.25-.775-.038T12 9.4v5.2q0 .45.4.663t.775-.038M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"/></svg></div>
          <div class="label" click="ProducaoIniciada()">Iniciar produção</div>
        </button>

        <button class="action btn-pause">
          <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 1 1-18 0a9 9 0 0 1 18 0"/></svg></div>
          <div class="label">Pausar produção</div>
        </button>

        <button class="action btn-finish">
          <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 1024 1024"><path fill="currentColor" d="M280.768 753.728L691.456 167.04a32 32 0 1 1 52.416 36.672L314.24 817.472a32 32 0 0 1-45.44 7.296l-230.4-172.8a32 32 0 0 1 38.4-51.2zM736 448a32 32 0 1 1 0-64h192a32 32 0 1 1 0 64zM608 640a32 32 0 0 1 0-64h319.936a32 32 0 1 1 0 64zM480 832a32 32 0 1 1 0-64h447.936a32 32 0 1 1 0 64z"/></svg></div>
          <div class="label">Finalizar produção</div>
        </button>
      </div>
    </section>
  </main>
</div>
