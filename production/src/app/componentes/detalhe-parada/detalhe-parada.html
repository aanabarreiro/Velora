
  <header class="topbar">
    <div class="logo-wrap">
      <img src="/mnt/data/74580e74-d6c8-4fc2-9676-c44104271603.png" alt="logo" class="logo" />
    </div>
    <div class="user">Carlos <span class="avatar"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 34 34">
        <g fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linejoin="round" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z" />
          <circle cx="12" cy="7" r="3" />
        </g>
      </svg></span></div>
  </header>

  <main class="card">
    <h2 class="title">Ordem atual</h2>

    <div class="order-row">
      <div class="order-tag">{{ orderId }}</div>

      <div class="select-wrap">
        <select [(ngModel)]="stopType">
          <option value="" disabled selected>Tipo de parada</option>
          <option *ngFor="let t of stopTypes" [value]="t">{{ t }}</option>
        </select>
        <span class="chev">▾</span>
      </div>
    </div>

    <div class="detail-box">
      <label class="detail-label">Detalhe o motivo da parada:</label>
      <textarea [(ngModel)]= "detail" rows="6" placeholder="Digite aqui"></textarea>
    </div>

    <div class="actions">
      <button class="btn cancel" (click)="cancel()">Cancelar parada</button>
      <button class="btn send" (click)="submit()">Enviar</button>
    </div>
  </main>
