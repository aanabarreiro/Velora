<div class="app-wrap">
  <header class="top-bar">
    <img src="../../../assets/img/branco_alto_contraste.png" alt="logo" class="V">
      <div class="user-info">
        <div>
        <span>Carlos  </span><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 34 34"><g fill="none" stroke="currentColor" stroke-width="2"><path stroke-linejoin="round" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="12" cy="7" r="3"/></g></svg>
        </div>
      </div>
</header>
<div class="gradiente"></div>  <!-- SIDEBAR -->


  <main class="card viewport">
    <div class="main">
      <div class="top-card">
        <div class="left-info">
          <h2 class="title">Ordem atual</h2>

          <div class="order-id">
            <span class="order-label">OS-</span>
            <span class="order-number">12345</span>
          </div>
        </div>

        <div class="side-info col center">
          <p class="detail-title"><b> Cliente: </b></p>
          <p class="detail-value big">202 - DASS NORDESTE - ITAPIPOCA</p>

        </div>
      </div>

      <div class="details-grid">
        <div class="col">
          <p class="detail-title">Ordem de compra:</p>
          <p class="detail-value">14749476</p>

          <p class="detail-title">Artigo:</p>
          <p class="detail-value">3404 - NAPA OUTDOOR</p>

          <p class="detail-title">Espessura Final:</p>
          <p class="detail-value">09/11</p>
        </div>

        <div class="col right">
          <p class="detail-title">Cor:</p>
          <p class="detail-value">STONE KHAKI</p>

          <p class="detail-title">Tipo Acabado:</p>
          <p class="detail-value">SEM ESTAMPA</p>

          <p class="detail-title">Toque:</p>
          <p class="detail-value">MACIO</p>
        </div>
      </div>
    </div>

    <div class="actions-row">
      <button class="action btn-start">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16"><path fill="currentColor" d="M8 15c-3.86 0-7-3.14-7-7s3.14-7 7-7s7 3.14 7 7s-3.14 7-7 7M8 2C4.69 2 2 4.69 2 8s2.69 6 6 6s6-2.69 6-6s-2.69-6-6-6"/><path fill="currentColor" d="M10 10.5c-.09 0-.18-.02-.26-.07l-2.5-1.5A.5.5 0 0 1 7 8.5v-4c0-.28.22-.5.5-.5s.5.22.5.5v3.72l2.26 1.35a.502.502 0 0 1-.26.93"/></svg></div>
        <div class="label" (click)="startTimer(120)"><span>{{timerFormatted}}</span> min para finalização da produção </div> 
      </button>

      <button class="action btn-pause">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10 9v6m4-6v6m7-3a9 9 0 1 1-18 0a9 9 0 0 1 18 0" />
          </svg></div>
      <div class="label" (click)="pauseTimer(); DetalheParada()">Pausar produção</div>
      </button>

      <button class="action btn-finish">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 1024 1024">
            <path fill="currentColor"
              d="M280.768 753.728L691.456 167.04a32 32 0 1 1 52.416 36.672L314.24 817.472a32 32 0 0 1-45.44 7.296l-230.4-172.8a32 32 0 0 1 38.4-51.2zM736 448a32 32 0 1 1 0-64h192a32 32 0 1 1 0 64zM608 640a32 32 0 0 1 0-64h319.936a32 32 0 1 1 0 64zM480 832a32 32 0 1 1 0-64h447.936a32 32 0 1 1 0 64z" />
          </svg></div>
        <div class="label" (click)="finalizarProducao()">Finalizar produção</div>
      </button>
    </div>
  </main>
</div>
